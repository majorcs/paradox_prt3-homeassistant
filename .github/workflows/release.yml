name: Release

# Pushing a CalVer tag (YYYY.MM.DD.N) publishes a GitHub release whose notes
# come from the matching CHANGELOG.md section.
on:
  push:
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches manifest.json
        run: |
          version=$(python3 -c "import json;print(json.load(open('custom_components/paradox_prt3/manifest.json'))['version'])")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1
          fi
      - name: Extract release notes
        run: |
          awk -v tag="## $GITHUB_REF_NAME" '$0==tag{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $GITHUB_REF_NAME"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
